<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会话测试台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <header class="page-header">
          <h1>会话测试台</h1>
          <p class="subtitle">以测试组为单位，创建共享配置的虚拟会话并并行测试</p>
        </header>

        <section class="card">
          <h2>创建测试组</h2>
          <div class="form-col">
            <div class="form-grid">
              <label>组名
                <input id="create-group-name" type="text" placeholder="如：OpenAI 提示词对比" />
              </label>
              <label>会话数量
                <input id="create-count" type="number" min="1" max="500" value="3" />
              </label>
              <label>平台来源
                <select id="create-platform"></select>
              </label>
              <label>配置档案
                <select id="create-conf"><option value="">默认配置</option></select>
              </label>
            </div>
            <details class="adv">
              <summary>发送者与命名（可选）</summary>
              <div class="form-grid">
                <label>发送者ID
                  <input id="create-sender-id" type="text" value="virtual_user" />
                </label>
                <label>发送者昵称
                  <input id="create-sender-name" type="text" value="虚拟用户" />
                </label>
                <label>会话名称前缀
                  <input id="create-name-prefix" type="text" placeholder="默认使用组名" />
                </label>
              </div>
            </details>
            <p class="hint">组内所有会话共享以上配置，单个会话可在列表中「设置」覆盖。</p>
            <button id="btn-create" class="btn primary">创建测试组</button>
          </div>
        </section>

        <section class="card groups-card">
          <h2>测试组列表</h2>
          <div class="toolbar">
            <button id="btn-refresh" class="btn small">刷新</button>
            <span id="group-count" class="count-label"></span>
          </div>
          <div id="group-list" class="group-list"></div>
        </section>
      </aside>

      <main class="workspace">
        <section class="card run-bar">
          <div class="run-row">
            <label class="full">群发消息（发送给所有已打开的会话）
              <input id="run-text" type="text" placeholder="输入一条消息，发送给所有已打开的会话" />
            </label>
            <button id="btn-run-all" class="btn primary">发送到全部</button>
            <details class="adv inline">
              <summary>高级</summary>
              <div class="adv-row">
                <label>超时(秒)
                  <input id="run-timeout" type="number" value="120" min="1" />
                </label>
                <label>每批数量
                  <input id="run-batch-size" type="number" value="10" min="1" />
                </label>
              </div>
            </details>
            <label class="align-toggle" title="启用后所有面板按对话轮次对齐，滑动条可同步滚动全部窗口">
              <input id="align-toggle" type="checkbox" />
              轮次对齐
            </label>
          </div>
          <div id="run-status" class="run-status" hidden></div>
        </section>

        <section class="workspace-body">
          <div id="panels" class="panels"></div>
          <div id="empty-hint" class="empty">
            创建测试组后，点「打开全部」或单个会话的「打开」即可并行查看；<br />
            面板可拖拽排序、可置顶，每个面板可单独发送消息。
          </div>
        </section>

        <div id="align-bar" class="align-bar" hidden>
          <span id="align-turn-label" class="align-label">轮次 1/1</span>
          <input id="align-slider" type="range" min="1" max="1" value="1" step="1" />
        </div>
      </main>
    </div>

    <div id="modal-mask" class="modal-mask" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn">取消</button>
          <button id="modal-ok" class="btn primary">确定</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
