<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会话测试台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <header class="page-header">
          <h1>会话测试台</h1>
          <p class="subtitle">创建虚拟会话，并行打开查看并测试</p>
        </header>

        <section class="card">
          <h2>创建虚拟会话</h2>
          <div class="form-col">
            <div class="form-grid">
              <label>数量
                <input id="create-count" type="number" min="1" max="500" value="3" />
              </label>
              <label>平台来源
                <select id="create-platform"></select>
              </label>
              <label class="full">配置档案
                <select id="create-conf"><option value="">默认配置</option></select>
              </label>
            </div>
            <details class="adv">
              <summary>发送者与命名（可选）</summary>
              <div class="form-grid">
                <label>发送者ID
                  <input id="create-sender-id" type="text" value="virtual_user" />
                </label>
                <label>发送者昵称
                  <input id="create-sender-name" type="text" value="虚拟用户" />
                </label>
                <label>名称前缀
                  <input id="create-name-prefix" type="text" placeholder="虚拟会话" />
                </label>
              </div>
            </details>
            <button id="btn-create" class="btn primary">创建会话</button>
          </div>
        </section>

        <section class="card sessions-card">
          <h2>会话列表</h2>
          <div class="toolbar">
            <button id="btn-refresh" class="btn small">刷新</button>
            <span id="session-count" class="count-label"></span>
          </div>
          <div id="session-list" class="session-list"></div>
        </section>
      </aside>

      <main class="workspace">
        <section class="card run-bar">
          <div class="run-row">
            <label class="full">群发消息（发送给所有已打开的会话）
              <input id="run-text" type="text" placeholder="输入一条消息，发送给所有已打开的会话" />
            </label>
            <button id="btn-run-all" class="btn primary">发送到全部</button>
            <details class="adv inline">
              <summary>高级</summary>
              <div class="adv-row">
                <label>超时(秒)
                  <input id="run-timeout" type="number" value="120" min="1" />
                </label>
                <label>每批数量
                  <input id="run-batch-size" type="number" value="10" min="1" />
                </label>
              </div>
            </details>
          </div>
          <div id="run-status" class="run-status" hidden></div>
        </section>

        <section class="workspace-body">
          <div id="panels" class="panels"></div>
          <div id="empty-hint" class="empty">
            点击左侧会话列表的「打开」即可并行查看；<br />
            面板可拖拽排序、可置顶，每个面板可单独发送消息。
          </div>
        </section>
      </main>
    </div>

    <div id="modal-mask" class="modal-mask" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn">取消</button>
          <button id="modal-ok" class="btn primary">确定</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
