name: 🧪 单元测试

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, master, dev/* ]

jobs:
  pytest:
    name: Pytest 单元测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # astrbot 双矩阵：最低支持版（metadata.yaml 声明 >=4.26.0——插件 Web API
    # astrbot.api.web 由 PR #8688 的 FastAPI 迁移引入，首个包含版本为 v4.26.0，
    # 4.24.1/4.25.x 均无此模块）+ latest（上游 AstrBot 最新版，不写死版本）。
    # 最低版恒绿作回归基准（直接依赖内部模块的用例跳过）；latest 随上游发版
    # 自动跟进，提前暴露上游 API 变更对插件的实际影响。
    strategy:
      fail-fast: false
      matrix:
        astrbot-version: ["4.26.0", "latest"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          if [ "${{ matrix.astrbot-version }}" = "latest" ]; then
            pip install astrbot
          else
            pip install "astrbot==${{ matrix.astrbot-version }}"
          fi
          # 打印实际安装版本，便于按 CI 日志定位上游变更
          python -c "import astrbot, importlib.metadata as m; print('astrbot version:', m.version('astrbot'))"
          # pytest 系同样锁定，防工具链自身升级引入噪音
          pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"

      - name: 运行单元测试
        run: |
          # 后端测试需要 astrbot（插件运行时依赖，PyPI 包）；
          # 前端静态检查（tests/test_frontend.py）零依赖，任何环境可运行。
          # 最低支持版矩阵跳过直接依赖 astrbot.core.* 内部模块的用例
          # （framework_internal 标记，无版本契约，随实测版 bump 显式验证）。
          if [ "${{ matrix.astrbot-version }}" = "4.26.0" ]; then
            OUT=$(python -m pytest tests/ -q --tb=short -m "not framework_internal" 2>&1)
          else
            OUT=$(python -m pytest tests/ -q --tb=short 2>&1)
          fi
          echo "$OUT"
          # TB-29：本地缺 astrbot 时整组 importorskip 会让 CI「全绿但零覆盖」——
          # 跳过数必须为 0（framework_internal 用例是 deselect 而非 skip，不误伤）
          if echo "$OUT" | grep -qi "skipped"; then
            echo "::error::存在被跳过的测试（预期 0）——astrbot 可能未正确安装"
            exit 1
          fi

  js-check:
    name: 前端 JS 语法与纯函数测试
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查 JS 语法（node --check + node:test 动态测试）
        run: |
          set -euo pipefail
          # ES module import 需 .mjs 后缀才被 node 识别；与本地验证方式一致。
          # 前端已拆分为多模块：入口 app.js + 事件反馈（events）/ 测试集运行（testset_run）
          # / 测试集编辑器（testset_editor）/ 报告视图（testset_reports）/ 身份与群聊
          # （identity_list）+ api/align/chat/state/utils/modal/group_list/testset_list
          # + pure + render_markdown。
          for f in app api align chat state utils modal group_list testset_list testset_editor testset_reports events testset_run identity_list pure render_markdown; do
            cp "pages/testbench/$f.js" "$RUNNER_TEMP/$f.mjs"
            node --check "$RUNNER_TEMP/$f.mjs"
          done
          # Phase 2：pure.js 纯函数动态测试（node:test 零依赖，仓库根 package.json
          # 声明 type: module）。目录参数形式在 Node ≥21 有回归（nodejs/node#64555，
          # 把目录当模块加载），故用 glob 形式。
          node --test "tests/frontend/*.test.mjs"
