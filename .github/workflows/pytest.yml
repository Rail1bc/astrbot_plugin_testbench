name: 🧪 单元测试

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, master, dev/* ]

jobs:
  pytest:
    name: Pytest 单元测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install astrbot pytest pytest-asyncio

      - name: 运行单元测试
        run: |
          # 后端测试需要 astrbot（插件运行时依赖，PyPI 包）；
          # 前端静态检查（tests/test_frontend.py）零依赖，任何环境可运行。
          python -m pytest tests/ -q --tb=short

  js-check:
    name: 前端 JS 语法与纯函数测试
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查 JS 语法（node --check + node:test 动态测试）
        run: |
          set -euo pipefail
          # ES module import 需 .mjs 后缀才被 node 识别；与本地验证方式一致。
          # 前端已拆分为多模块：入口 app.js + 事件反馈（events）/ 测试集运行（testset_run）
          # / 测试集编辑器（testset_editor）/ 身份与群聊（identity_list）
          # + api/align/chat/state/utils/modal/group_list/testset_list + pure。
          for f in app api align chat state utils modal group_list testset_list testset_editor events testset_run identity_list pure; do
            cp "pages/testbench/$f.js" "$RUNNER_TEMP/$f.mjs"
            node --check "$RUNNER_TEMP/$f.mjs"
          done
          # Phase 2：pure.js 纯函数动态测试（node:test 零依赖，仓库根 package.json
          # 声明 type: module）。目录参数形式在 Node ≥21 有回归（nodejs/node#64555，
          # 把目录当模块加载），故用 glob 形式。
          node --test "tests/frontend/*.test.mjs"
