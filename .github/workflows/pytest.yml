name: 🧪 单元测试

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, master, dev/* ]

jobs:
  pytest:
    name: Pytest 单元测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # astrbot 依赖上游 PyPI 最新版（不写死版本，随上游发版自动跟进）。
    # 曾尝试「最低支持版 4.26.0 + latest」双矩阵，但固定旧版本在 CI 上
    # 安装/运行不可靠（旧版重依赖在全新 runner 环境解析失败），且与插件
    # 实际使用场景（用户总是跑最新 AstrBot）脱节——砍掉固定版本 leg，
    # 只保留 latest：上游 API 变更对插件的影响在 CI 第一时间暴露。

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install astrbot
          # 打印实际安装版本，便于按 CI 日志定位上游变更
          python -c "import astrbot, importlib.metadata as m; print('astrbot version:', m.version('astrbot'))"
          # pytest 系同样锁定，防工具链自身升级引入噪音
          pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"

      - name: 运行单元测试
        run: |
          # 后端测试需要 astrbot（插件运行时依赖，PyPI 包）；
          # 前端静态检查（tests/test_frontend.py）零依赖，任何环境可运行。
          # framework_internal 标记的用例（直接依赖 astrbot.core.* 内部模块）
          # 在最新版上全量运行（上游最新版应具备全部内部 API）。
          OUT=$(python -m pytest tests/ -q --tb=short 2>&1)
          echo "$OUT"
          # TB-29：本地缺 astrbot 时整组 importorskip 会让 CI「全绿但零覆盖」——
          # 跳过数必须为 0
          if echo "$OUT" | grep -qi "skipped"; then
            echo "::error::存在被跳过的测试（预期 0）——astrbot 可能未正确安装"
            exit 1
          fi

  js-check:
    name: 前端 JS 语法与纯函数测试
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查 JS 语法（node --check + node:test 动态测试）
        run: |
          set -euo pipefail
          # ES module import 需 .mjs 后缀才被 node 识别；与本地验证方式一致。
          # 前端已拆分为多模块：入口 app.js + 事件反馈（events）/ 测试集运行（testset_run）
          # / 测试集编辑器（testset_editor）/ 报告视图（testset_reports）/ 身份与群聊
          # （identity_list）+ api/align/chat/state/utils/modal/group_list/testset_list
          # + pure + render_markdown。
          for f in app api align chat state utils modal group_list testset_list testset_editor testset_reports events testset_run identity_list pure render_markdown; do
            cp "pages/testbench/$f.js" "$RUNNER_TEMP/$f.mjs"
            node --check "$RUNNER_TEMP/$f.mjs"
          done
          # Phase 2：pure.js 纯函数动态测试（node:test 零依赖，仓库根 package.json
          # 声明 type: module）。目录参数形式在 Node ≥21 有回归（nodejs/node#64555，
          # 把目录当模块加载），故用 glob 形式。
          node --test "tests/frontend/*.test.mjs"
